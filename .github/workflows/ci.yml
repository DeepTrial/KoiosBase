name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Byte-compile check
        run: python -m compileall -q koiosbase tests

      - name: Run tests
        run: python -m pytest -q

  quality-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip ruff
      - name: Lint
        run: ruff check koiosbase tests
      - name: Format check
        run: ruff format --check koiosbase tests

  pdf:
    # The PDF adapter needs PyMuPDF; keep it in a dedicated job so a binary-wheel
    # hiccup cannot silently mask the core test suite.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - name: PDF + sources tests
        run: python -m pytest tests/test_pdf_sources.py -q
