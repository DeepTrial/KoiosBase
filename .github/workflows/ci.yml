name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # mupdf-sys compiles MuPDF from source, which needs libclang to generate
      # its bindings. Without this every build dies inside bindgen.
      - name: Install bindgen prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang libclang-dev

      - name: Build
        run: cargo build --release --manifest-path rust-cli/Cargo.toml

      - name: Run tests
        run: cargo test --release --manifest-path rust-cli/Cargo.toml

  # Clippy warnings used to accumulate unnoticed; fail on any new one.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Install bindgen prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang libclang-dev
      - name: Format check
        run: cargo fmt --manifest-path rust-cli/Cargo.toml -- --check
      - name: Clippy
        run: cargo clippy --release --manifest-path rust-cli/Cargo.toml -- -D warnings
