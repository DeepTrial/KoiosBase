name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.name }}
    # Each OS builds on its own native runner. Windows previously
    # cross-compiled from Linux via mingw-w64, which worked until §5.2.1
    # landed: ort-sys ships NO prebuilt binaries for x86_64-pc-windows-gnu
    # (its dist.tsv lists only -msvc for Windows), so the GNU target died with
    # "no prebuilt binaries available for target x86_64-pc-windows-gnu".
    # There is nothing to vendor around that -- it is the target triple. MSVC
    # is the supported combination, which means a native Windows runner, since
    # MSVC cannot link on Linux. mupdf-sys already handles msvc (it branches on
    # target.env == "msvc" in its build script), so nothing else was blocking.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: koios-linux-x86_64
            bin: koios
            # glibc, not musl. MuPDF compiles a C++ translation unit
            # (source/fitz/tessocr.cpp) through the generic %.cpp rule, so the
            # build needs a C++ compiler for the target. musl-tools ships only
            # the C toolchain — there is no musl C++ cross-compiler in the
            # Ubuntu repos — so the musl job died with
            # "x86_64-linux-musl-g++: not found". The runner already has g++.
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: koios-windows-x86_64.exe
            bin: koios.exe
            # Native runner: MSVC is preinstalled, so no install step needed.

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross toolchain (linux)
        # Nothing to install on Windows: the native runner already has both the
        # MSVC linker and bindgen's requirements.
        if: matrix.pre != ''
        run: ${{ matrix.pre }}

      - name: Install bindgen prerequisites (linux)
        # Kept from before: LLVM/libclang for the generated MuPDF bindings.
        # Windows relies on the runner image.
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y llvm-dev libclang-dev clang

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        working-directory: rust-cli
        env:
          # Windows-only, and the reason it has to be said explicitly:
          # Rust's msvc targets default to +crt-static, so every Rust-compiled
          # object expects the STATIC CRT (MT_StaticRelease), while mupdf's
          # own static library is built against the DYNAMIC one
          # (MD_DynamicRelease). Linking both into one .exe gave
          # "LNK2038 ... RuntimeLibrary mismatch" 1036 times over.
          # This switches Rust to the dynamic CRT so both sides agree.
          RUSTFLAGS: ${{ matrix.os == 'windows-latest' && '-C target-feature=-crt-static' || '' }}
        run: cargo build --release --target ${{ matrix.target }}

      - name: Smoke test (POSIX shell only)
        if: matrix.os == 'ubuntu-latest'
        working-directory: rust-cli
        run: |
          set -e
          BIN=target/${{ matrix.target }}/release/${{ matrix.bin }}
          "$BIN" --version
          rm -rf /tmp/smoke && "$BIN" init /tmp/smoke
          printf -- '---\ntitle: 冒烟\n---\n\n# 章节\n\nACME 公司 2024 年营收为 32 亿元。\n' > /tmp/smoke/raw/s.md
          "$BIN" index /tmp/smoke
          "$BIN" search 营收 -p /tmp/smoke
          # `lint` exits non-zero when it finds anything, and this fixture
          # genuinely has findings (an unsourced sources/ assertion, orphan
          # pages). That is the tool working, not a broken build — assert it
          # ran and reported, rather than that it was silent.
          "$BIN" lint /tmp/smoke || true

      - name: Smoke test (windows)
        if: matrix.os == 'windows-latest'
        working-directory: rust-cli
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bin = "target/${{ matrix.target }}/release/${{ matrix.bin }}"
          & $bin --version
          $smoke = Join-Path $env:RUNNER_TEMP 'smoke'
          if (Test-Path $smoke) { Remove-Item -Recurse -Force $smoke }
          & $bin init $smoke
          Set-Content -Path (Join-Path $smoke 'raw/s.md') -Encoding utf8 -Value "---`ntitle: smoke`n---`n`n# 章节`n`nACME 公司 2024 年营收为 32 亿元。`n"
          & $bin index $smoke
          & $bin search 营收 -p $smoke

      - name: Rename artifact
        shell: bash
        run: |
          mkdir -p dist
          cp rust-cli/target/${{ matrix.target }}/release/${{ matrix.bin }} dist/${{ matrix.asset }}
          chmod +x dist/${{ matrix.asset }} 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
