[package]
name = "koios"
version = "0.9.0"
edition = "2021"
# LICENSE NOTE (deliberate, reviewed 2026-10-02):
# KoiosBase itself is MIT (see /LICENSE), but the PDF tier links MuPDF via the
# `mupdf` crate, which is AGPL-3.0-or-later OR Artifex commercial. That is the
# SAME licensing position the Python shell already had — its single runtime
# dependency, PyMuPDF, carries those exact terms — so this does not add a new
# obligation; it keeps parity. What does change is that the AGPL obligation now
# attaches to a DISTRIBUTED BINARY rather than to an interpreter-time import.
# Anyone redistributing this binary must therefore offer the corresponding
# source under AGPL-3.0 (or buy an Artifex commercial licence) for MuPDF.
# Choose `features` below so you only pay for what you use.
license = "MIT"

[lib]
name = "koios"
path = "src/lib.rs"

[dependencies]
rusqlite = { version = "0.31", features = ["bundled"] }
clap = { version = "4", features = ["derive"] }
regex = "1"
once_cell = "1"
# preserve_order: serde_json defaults to BTreeMap (sorted keys), which reorders
# every MCP payload relative to Python's dict ordering.
serde_json = { version = "1", features = ["preserve_order"] }
# MuPDF (via mupdf-rs) replaces `pdf-extract` so the Rust shell uses the SAME
# extraction engine as PyMuPDF. Default features pull in js/xps/svg/epub/
# tesseract/brotli — none of which §5.1 needs, and each adds build minutes plus
# more copyleft surface. Strip to the PDF core.
mupdf = { version = "0.8", default-features = false, features = ["base14-fonts"] }
sha2 = "0.10.9"
# Model access. ureq is synchronous on purpose: the pipeline blocks on the model
# call anyway, so an async runtime would add a large dependency tree and buy
# nothing. rustls rather than the platform TLS so the binary stays portable.
# No provider SDK — the wire format is the OpenAI chat shape, which local
# servers (llama.cpp, vLLM, Ollama) also speak.
ureq = { version = "3", default-features = false, features = ["json", "rustls"] }
toml = "1.1.7"
serde = { version = "1.0.229", features = ["derive"] }
# Only for restoring SIGPIPE's platform default (see main::install_sigpipe_default)
# and for undoing it in spawned model children (see llm::run_command).
# Unix-only so the Windows release target does not link it.
[target.'cfg(unix)'.dependencies]
libc = "0.2"
