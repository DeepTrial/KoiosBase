[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "koiosbase"
version = "0.1.0"
description = "A lightweight, Markdown-native LLM knowledge base: compile knowledge at ingest, navigate at query."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "DeepTrial" }]
keywords = ["rag", "knowledge-base", "markdown", "llm", "retrieval"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Text Processing :: Markup :: Markdown",
]

dependencies = ["pymupdf>=1.24"]

[project.optional-dependencies]
test = ["pytest>=8", "pymupdf>=1.24"]

[project.scripts]
koios = "koiosbase.cli:main"

[tool.setuptools.packages.find]
include = ["koiosbase*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
